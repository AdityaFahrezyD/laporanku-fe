<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F444C" />
    <title>Offline | LaporanKu</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #F1ECE9; color: #1F444C; font-family: 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 80px; height: 80px; }
      p { line-height: 1.6; }
      button { border: 0; border-radius: 12px; background: #1F444C; color: white; padding: 14px 24px; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #A45F1A; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Koneksi terputus</h1>
      <p>Hubungkan perangkat ke internet untuk membuka LaporanKu. Melihat data terbaru dan menyimpan transaksi membutuhkan koneksi.</p>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
